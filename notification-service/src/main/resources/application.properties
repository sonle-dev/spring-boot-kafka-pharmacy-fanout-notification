server.port=8085
spring.application.name=notification-service

# Cấu hình Kafka Consumer (GROUP-ID KHÁC VỚI INVENTORY-SERVICE)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
app.kafka.topic.medicine-stock=medicine-stock-events

# Database (kết nối cùng DB để lấy tên thuốc và giá)
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Spring Mail gửi Gmail (Thay bằng email và Mật khẩu ứng dụng 16 ký tự của bạn)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email người nhận mặc định để test
app.mail.customer-email=test-customer@gmail.com